# =============================================================================
# Apache Virtual Host Configuration for JS Admin Panel
# Generated: 2024-12-16
#
# This file contains virtual host configuration for:
# - js-admin.veldev.com: Admin Panel (Frontend + API)
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP to HTTPS Redirect
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName js-admin.veldev.com

    # Redirect all traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# -----------------------------------------------------------------------------
# HTTPS Configuration for js-admin.veldev.com
# Frontend: port 3000, API: port 4000
# -----------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName js-admin.veldev.com

    # -------------------------------------------------------------------------
    # SSL Configuration
    # Using Let's Encrypt wildcard certificate for *.veldev.com
    # -------------------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/veldev.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/veldev.com/privkey.pem

    # Modern SSL configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # -------------------------------------------------------------------------
    # Proxy Configuration
    # -------------------------------------------------------------------------
    ProxyPreserveHost On

    # API routes - proxy to Fastify backend (port 4000)
    ProxyPass /api http://127.0.0.1:4000/api
    ProxyPassReverse /api http://127.0.0.1:4000/api

    # API health check
    ProxyPass /health http://127.0.0.1:4000/health
    ProxyPassReverse /health http://127.0.0.1:4000/health

    # API documentation (Swagger)
    ProxyPass /docs http://127.0.0.1:4000/docs
    ProxyPassReverse /docs http://127.0.0.1:4000/docs

    # Frontend - proxy to Vite/React dev server (port 3000)
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # -------------------------------------------------------------------------
    # Headers for API requests
    # -------------------------------------------------------------------------
    <Location /api>
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    </Location>

    # -------------------------------------------------------------------------
    # Headers for Frontend requests
    # -------------------------------------------------------------------------
    <Location />
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    </Location>

    # -------------------------------------------------------------------------
    # WebSocket Support for Vite HMR (Hot Module Replacement)
    # Required for development mode live reloading
    # -------------------------------------------------------------------------
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/js-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/js-admin-access.log combined
</VirtualHost>
