# ============================================
# Docker Compose - Production Mode
# ============================================
# Usage: docker-compose up -d --build
#
# This builds optimized production images.
# For development with hot reload, use:
#   docker-compose -f docker-compose.dev.yml up
#
# SECURITY: Before deploying to production, create a .env file with:
#   POSTGRES_PASSWORD=<strong-random-password>
#   REDIS_PASSWORD=<strong-random-password>
#   MINIO_ROOT_PASSWORD=<strong-random-password>
#   JWT_SECRET=<openssl rand -base64 48>
#
# Generate secure passwords: openssl rand -base64 32
# ============================================

services:
  redis:
    image: redis:7-alpine
    container_name: admin-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_change_me}
    # ports:
    #   - '16379:6379'  # Uncomment for external access (development only)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_secure_password_change_me}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: admin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # ports:
    #   - '19000:9000'  # Uncomment for external access (development only)
    #   - '19001:9001'  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: admin-minio-init
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/uploads --ignore-existing;
      mc anonymous set none myminio/uploads;
      exit 0;
      "

  # ----------------------------------------
  # API - Production build
  # ----------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: admin-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000/api/i18n/locales']
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - uploads_data:/app/uploads
      # Fruugo product feed directory (shared with SMS)
      - D:/wamp64/www/zenc-ukss-production/Fruugo_product_feed:/feeds/fruugo
      # Sportdeal product feed directory (shared with SMS)
      - D:/wamp64/www/zenc-ukss-production/feed/sportdeal_feed:/feeds/sportdeal
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # ----------------------------------------
  # Web - Production build (nginx)
  # ----------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: admin-web
    restart: unless-stopped
    ports:
      - '3002:80'
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
  minio_data:
  uploads_data:

networks:
  default:
    name: admin-staging-network
